<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<meta name="theme-color" content="#050713">

<meta name="description"
content="NEON SNAKE - Cyber Arena">

<title>NEON SNAKE | Cyber Arena</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">

<!-- YOUR ICON -->
<link rel="icon"
type="image/png"
sizes="512x512"
href="icon.png">

<link rel="apple-touch-icon"
href="icon.png">


<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =========================================================
   BODY
========================================================= */

html{
    width:100%;
    min-height:100%;
    background:#050713;
}

body{

    width:100%;
    min-height:100vh;

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    color:#ffffff;

    background:
    radial-gradient(
        circle at 50% 0%,
        #18275f 0%,
        #0b1230 35%,
        #050713 70%,
        #02030a 100%
    );

    overflow-x:hidden;

    touch-action:pan-y;
}


/* =========================================================
   BACKGROUND GRID
========================================================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    background-image:

    linear-gradient(
        rgba(0,255,255,.035) 1px,
        transparent 1px
    ),

    linear-gradient(
        90deg,
        rgba(0,255,255,.035) 1px,
        transparent 1px
    );

    background-size:40px 40px;

    mask-image:
    linear-gradient(
        to bottom,
        black,
        transparent 90%
    );

    z-index:0;
}


/* =========================================================
   MAIN WRAPPER
========================================================= */

.game-wrapper{

    width:100%;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    padding:25px 12px 40px;

    position:relative;

    z-index:1;
}


/* =========================================================
   GAME PANEL
========================================================= */

.game-panel{

    width:min(94vw,620px);

    padding:22px;

    border-radius:28px;

    background:
    rgba(8,12,35,.88);

    border:
    1px solid rgba(0,255,255,.18);

    box-shadow:

    0 0 0 1px rgba(255,255,255,.03),

    0 20px 80px rgba(0,0,0,.5),

    0 0 50px rgba(0,255,255,.08);

    backdrop-filter:blur(18px);
}


/* =========================================================
   LOGO
========================================================= */

.logo{

    text-align:center;

    margin-bottom:18px;
}

.logo-icon{

    font-size:42px;

    margin-bottom:3px;

    filter:
    drop-shadow(0 0 12px #00ffff);
}

.logo h1{

    font-size:clamp(28px,7vw,48px);

    letter-spacing:5px;

    font-weight:900;

    background:
    linear-gradient(
        90deg,
        #00ffff,
        #ffffff,
        #b76cff,
        #00ffff
    );

    background-size:250%;

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

    animation:
    logoFlow 5s linear infinite;
}

.logo p{

    margin-top:3px;

    font-size:11px;

    letter-spacing:5px;

    color:#7f91c8;
}


@keyframes logoFlow{

    0%{
        background-position:0%;
    }

    100%{
        background-position:250%;
    }

}


/* =========================================================
   HUD
========================================================= */

.hud{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:10px;

    margin-bottom:12px;
}

.hud-box{

    padding:10px 5px;

    text-align:center;

    border-radius:15px;

    background:
    rgba(255,255,255,.035);

    border:
    1px solid rgba(255,255,255,.08);
}

.hud-title{

    font-size:9px;

    letter-spacing:2px;

    color:#7583aa;

    text-transform:uppercase;
}

.hud-value{

    margin-top:4px;

    font-size:23px;

    font-weight:800;

    color:#ffffff;

    text-shadow:
    0 0 12px rgba(0,255,255,.5);
}


/* =========================================================
   POWER BAR
========================================================= */

.power-bar{

    min-height:28px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:6px;

    margin-bottom:10px;

    flex-wrap:wrap;
}

.power{

    padding:5px 10px;

    border-radius:999px;

    font-size:10px;

    font-weight:bold;

    letter-spacing:1px;

    background:
    rgba(0,255,255,.08);

    border:
    1px solid rgba(0,255,255,.2);
}


/* =========================================================
   CANVAS WRAPPER
========================================================= */

.canvas-wrapper{

    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:0;

}


/* =========================================================
   GAME CANVAS
========================================================= */

#game{

    width:100%;

    max-width:500px;

    height:auto;

    aspect-ratio:1/1;

    display:block;

    background:#03050d;

    border-radius:22px;

    border:
    1px solid rgba(0,255,255,.35);

    box-shadow:

    0 0 25px rgba(0,255,255,.08),

    inset 0 0 35px rgba(0,0,0,.8);

    touch-action:none;
}


/* =========================================================
   DESKTOP BUTTONS
========================================================= */

.button-area{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-top:14px;
}

button{

    border:0;

    outline:none;

    cursor:pointer;

    font-family:inherit;

    -webkit-tap-highlight-color:transparent;

    user-select:none;
}

.btn-primary,
.btn-secondary{

    min-height:48px;

    border-radius:15px;

    font-size:13px;

    font-weight:800;

    letter-spacing:2px;

    transition:.15s;
}

.btn-primary{

    color:#001014;

    background:
    linear-gradient(
        135deg,
        #00ffff,
        #78f7ff
    );

    box-shadow:
    0 0 20px rgba(0,255,255,.22);
}

.btn-secondary{

    color:#dce7ff;

    background:
    rgba(255,255,255,.06);

    border:
    1px solid rgba(255,255,255,.1);
}

.btn-primary:active,
.btn-secondary:active{

    transform:scale(.96);
}


/* =========================================================
   MOBILE D-PAD
========================================================= */

.mobile-controls{

    display:none;

    width:100%;

    margin-top:16px;

    text-align:center;

    user-select:none;

    touch-action:manipulation;
}

.mobile-controls .row{

    display:flex;

    justify-content:center;

    align-items:center;
}

.mobile-controls button{

    width:58px;

    height:58px;

    margin:4px;

    border-radius:17px;

    color:#00ffff;

    font-size:24px;

    font-weight:900;

    background:
    linear-gradient(
        145deg,
        rgba(0,255,255,.12),
        rgba(130,70,255,.10)
    );

    border:
    1px solid rgba(0,255,255,.45);

    box-shadow:

    0 0 18px rgba(0,255,255,.12),

    inset 0 0 12px rgba(0,255,255,.04);

    transition:
    transform .08s,
    background .08s;
}

.mobile-controls button:active{

    transform:scale(.88);

    background:
    rgba(0,255,255,.3);

    box-shadow:
    0 0 25px rgba(0,255,255,.3);
}


/* =========================================================
   SCREENS
========================================================= */

.screen{

    position:fixed;

    inset:0;

    z-index:50;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    background:
    rgba(2,4,15,.78);

    backdrop-filter:blur(12px);
}

.screen.hidden{

    display:none;
}

.screen-card{

    width:min(92vw,430px);

    padding:35px 25px;

    text-align:center;

    border-radius:28px;

    background:
    linear-gradient(
        145deg,
        rgba(14,22,58,.96),
        rgba(5,8,25,.96)
    );

    border:
    1px solid rgba(0,255,255,.25);

    box-shadow:

    0 0 70px rgba(0,255,255,.1),

    0 30px 100px rgba(0,0,0,.65);
}

.screen-icon{

    font-size:55px;

    margin-bottom:12px;

    filter:
    drop-shadow(0 0 18px #00ffff);
}

.screen-card h2{

    font-size:clamp(28px,8vw,45px);

    letter-spacing:4px;

    margin-bottom:10px;

    background:
    linear-gradient(
        90deg,
        #00ffff,
        #ffffff,
        #c177ff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.screen-card p{

    color:#8e9bc0;

    line-height:1.7;

    font-size:14px;

    margin:8px 0;
}

.tagline{

    font-size:11px !important;

    color:#7180a9 !important;

    letter-spacing:.5px;
}

.screen-card .btn-primary{

    width:100%;

    margin-top:18px;
}


/* =========================================================
   DESKTOP SWIPE INFO
========================================================= */

.mobile-hint{

    display:none;

    text-align:center;

    margin-top:10px;

    font-size:9px;

    letter-spacing:1px;

    color:#5e6c94;
}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:600px){

    body{

        overflow-x:hidden;

    }

    .game-wrapper{

        padding:
        12px
        8px
        25px;

    }

    .game-panel{

        width:100%;

        padding:14px;

        border-radius:22px;

    }

    .logo{

        margin-bottom:12px;

    }

    .logo-icon{

        font-size:32px;

    }

    .logo h1{

        font-size:27px;

        letter-spacing:3px;

    }

    .logo p{

        font-size:8px;

        letter-spacing:3px;

    }

    .hud{

        gap:6px;

    }

    .hud-box{

        padding:8px 3px;

    }

    .hud-value{

        font-size:19px;

    }

    .button-area{

        grid-template-columns:1fr 1fr;

    }

    .mobile-controls{

        display:block;

    }

    .mobile-hint{

        display:block;

    }

    .mobile-controls button{

        width:56px;

        height:56px;

    }

}


/* =========================================================
   VERY SMALL PHONE
========================================================= */

@media(max-width:380px){

    .game-panel{

        padding:10px;

    }

    .mobile-controls button{

        width:52px;

        height:52px;

        margin:3px;

    }

    .btn-primary,
    .btn-secondary{

        min-height:44px;

        font-size:11px;

    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *{

        animation:none !important;

        transition:none !important;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     START SCREEN
======================================================= -->

<div class="screen" id="startScreen">

    <div class="screen-card">

        <div class="screen-icon">
            🐍
        </div>

        <h2>
            NEON SNAKE
        </h2>

        <p>
            Enter the cyber arena.<br>
            Collect energy. Survive. Evolve.
        </p>

        <p class="tagline">
            🔴 Energy &nbsp; • &nbsp;
            💎 Crystal &nbsp; • &nbsp;
            ⚡ Boost
        </p>

        <p class="tagline">
            🛡️ Shield &nbsp; • &nbsp;
            🌀 Portal &nbsp; • &nbsp;
            💣 Bomb
        </p>

        <button
            class="btn-primary"
            id="startBtn">

            ▶ ENTER ARENA

        </button>

    </div>

</div>


<!-- =======================================================
     GAME OVER SCREEN
======================================================= -->

<div
    class="screen hidden"
    id="gameOverScreen">

    <div class="screen-card">

        <div class="screen-icon">
            💀
        </div>

        <h2>
            SYSTEM FAIL
        </h2>

        <p>
            Your signal has been lost.
        </p>

        <p>
            FINAL SCORE
        </p>

        <div
            id="finalScore"
            style="
            font-size:48px;
            font-weight:900;
            margin:8px 0;
            color:#ffffff;
            text-shadow:0 0 20px #00ffff;
            ">

            0

        </div>

        <button
            class="btn-primary"
            id="restartBtn">

            ↻ REBOOT SYSTEM

        </button>

    </div>

</div>


<!-- =======================================================
     MAIN GAME
======================================================= -->

<div class="game-wrapper">

    <div class="game-panel">


        <!-- LOGO -->

        <div class="logo">

            <div class="logo-icon">
                🐍
            </div>

            <h1>
                NEON SNAKE
            </h1>

            <p>
                CYBER ARENA
            </p>

        </div>


        <!-- HUD -->

        <div class="hud">

            <div class="hud-box">

                <div class="hud-title">
                    SCORE
                </div>

                <div
                    class="hud-value"
                    id="score">

                    0

                </div>

            </div>


            <div class="hud-box">

                <div class="hud-title">
                    LEVEL
                </div>

                <div
                    class="hud-value"
                    id="level">

                    1

                </div>

            </div>


            <div class="hud-box">

                <div class="hud-title">
                    BEST
                </div>

                <div
                    class="hud-value"
                    id="best">

                    0

                </div>

            </div>

        </div>


        <!-- POWER STATUS -->

        <div
            class="power-bar"
            id="powerBar">

        </div>


        <!-- GAME BOARD -->

        <div class="canvas-wrapper">

            <canvas
                id="game"
                width="500"
                height="500">

            </canvas>

        </div>


        <!-- DESKTOP BUTTONS -->

        <div class="button-area">

            <button
                class="btn-primary"
                id="playBtn">

                ▶ PLAY

            </button>

            <button
                class="btn-secondary"
                id="pauseBtn">

                ⏸ PAUSE

            </button>

        </div>


        <!-- =================================================
             MOBILE D-PAD
        ================================================== -->

        <div
            class="mobile-controls"
            id="mobileControls">


            <div class="row">

                <button
                    data-dir="up"
                    aria-label="Move Up">

                    ⬆

                </button>

            </div>


            <div class="row">

                <button
                    data-dir="left"
                    aria-label="Move Left">

                    ⬅

                </button>


                <button
                    data-dir="down"
                    aria-label="Move Down">

                    ⬇

                </button>


                <button
                    data-dir="right"
                    aria-label="Move Right">

                    ➡

                </button>

            </div>


        </div>


        <div class="mobile-hint">

            SWIPE OR USE THE D-PAD TO MOVE

        </div>


    </div>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");


/* =========================================================
   DOM
========================================================= */

const scoreEl =
document.getElementById("score");

const levelEl =
document.getElementById("level");

const bestEl =
document.getElementById("best");

const powerBar =
document.getElementById("powerBar");

const finalScoreEl =
document.getElementById("finalScore");

const startScreen =
document.getElementById("startScreen");

const gameOverScreen =
document.getElementById("gameOverScreen");

const startBtn =
document.getElementById("startBtn");

const restartBtn =
document.getElementById("restartBtn");

const playBtn =
document.getElementById("playBtn");

const pauseBtn =
document.getElementById("pauseBtn");


/* =========================================================
   GAME STATE
========================================================= */

const GRID = 20;

const CELL = canvas.width / GRID;

let snake = [];

let direction = "RIGHT";

let nextDirection = "RIGHT";

let score = 0;

let level = 1;

let best =
Number(localStorage.getItem("neonSnakeBest") || 0);

let gameRunning = false;

let paused = false;

let timer = null;

let food = null;

let crystal = null;

let bomb = null;

let portal = null;

let shieldActive = false;

let speedBoost = false;


/* =========================================================
   RANDOM POSITION
========================================================= */

function randomPosition(){

    return {

        x:
        Math.floor(Math.random() * GRID),

        y:
        Math.floor(Math.random() * GRID)

    };

}


/* =========================================================
   POSITION CHECK
========================================================= */

function isOnSnake(pos){

    return snake.some(
        part =>
        part.x === pos.x &&
        part.y === pos.y
    );

}


/* =========================================================
   SAFE POSITION
========================================================= */

function safePosition(){

    let position;

    let tries = 0;

    do{

        position =
        randomPosition();

        tries++;

    }

    while(
        isOnSnake(position) &&
        tries < 100
    );

    return position;

}


/* =========================================================
   CREATE ITEMS
========================================================= */

function createItems(){

    food =
    safePosition();

    crystal = null;

    bomb = null;

    portal = null;

}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground(){

    ctx.fillStyle =
    "#03050d";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* GRID */

    ctx.strokeStyle =
    "rgba(0,255,255,.055)";

    ctx.lineWidth = 1;

    for(
        let i=0;
        i<=GRID;
        i++
    ){

        const p =
        i * CELL;

        ctx.beginPath();

        ctx.moveTo(
            p,
            0
        );

        ctx.lineTo(
            p,
            canvas.height
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            p
        );

        ctx.lineTo(
            canvas.width,
            p
        );

        ctx.stroke();

    }


    /* BORDER */

    ctx.strokeStyle =
    "rgba(0,255,255,.35)";

    ctx.lineWidth = 2;

    ctx.strokeRect(
        1,
        1,
        canvas.width-2,
        canvas.height-2
    );

}


/* =========================================================
   DRAW FOOD
========================================================= */

function drawFood(){

    if(!food)
        return;

    const x =
    food.x * CELL + CELL/2;

    const y =
    food.y * CELL + CELL/2;


    ctx.save();

    ctx.shadowBlur = 22;

    ctx.shadowColor =
    "#ff305d";

    ctx.fillStyle =
    "#ff305d";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        CELL*.27,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* =========================================================
   DRAW CRYSTAL
========================================================= */

function drawCrystal(){

    if(!crystal)
        return;

    const x =
    crystal.x * CELL + CELL/2;

    const y =
    crystal.y * CELL + CELL/2;


    ctx.save();

    ctx.shadowBlur = 25;

    ctx.shadowColor =
    "#b76cff";

    ctx.fillStyle =
    "#b76cff";

    ctx.beginPath();

    ctx.moveTo(
        x,
        y-CELL*.35
    );

    ctx.lineTo(
        x+CELL*.3,
        y
    );

    ctx.lineTo(
        x,
        y+CELL*.35
    );

    ctx.lineTo(
        x-CELL*.3,
        y
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();

}


/* =========================================================
   DRAW BOMB
========================================================= */

function drawBomb(){

    if(!bomb)
        return;

    const x =
    bomb.x * CELL + CELL/2;

    const y =
    bomb.y * CELL + CELL/2;


    ctx.save();

    ctx.shadowBlur = 20;

    ctx.shadowColor =
    "#ff3b30";

    ctx.fillStyle =
    "#ff3b30";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        CELL*.28,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle =
    "#ffffff";

    ctx.font =
    "bold 13px Arial";

    ctx.textAlign =
    "center";

    ctx.textBaseline =
    "middle";

    ctx.fillText(
        "!",
        x,
        y
    );

    ctx.restore();

}


/* =========================================================
   DRAW PORTAL
========================================================= */

function drawPortal(){

    if(!portal)
        return;

    const x =
    portal.x * CELL + CELL/2;

    const y =
    portal.y * CELL + CELL/2;


    ctx.save();

    ctx.strokeStyle =
    "#00ffff";

    ctx.lineWidth = 3;

    ctx.shadowBlur = 25;

    ctx.shadowColor =
    "#00ffff";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        CELL*.3,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.restore();

}


/* =========================================================
   DRAW SNAKE
========================================================= */

function drawSnake(){

    snake.forEach(
        (part,index)=>{

            const x =
            part.x * CELL;

            const y =
            part.y * CELL;


            ctx.save();


            ctx.shadowBlur =
            index === 0 ? 24 : 12;

            ctx.shadowColor =
            index === 0
            ? "#ffffff"
            : "#00ffff";


            const gradient =
            ctx.createLinearGradient(
                x,
                y,
                x+CELL,
                y+CELL
            );

            gradient.addColorStop(
                0,
                index===0
                ? "#ffffff"
                : "#00ffff"
            );

            gradient.addColorStop(
                1,
                "#7d4dff"
            );


            ctx.fillStyle =
            gradient;


            ctx.beginPath();

            ctx.roundRect(
                x+2,
                y+2,
                CELL-4,
                CELL-4,
                6
            );

            ctx.fill();


            /* EYES */

            if(index===0){

                ctx.fillStyle =
                "#02030a";

                ctx.beginPath();

                ctx.arc(
                    x+CELL*.35,
                    y+CELL*.35,
                    2,
                    0,
                    Math.PI*2
                );

                ctx.arc(
                    x+CELL*.65,
                    y+CELL*.35,
                    2,
                    0,
                    Math.PI*2
                );

                ctx.fill();

            }


            ctx.restore();

        }
    );

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    drawBackground();

    drawFood();

    drawCrystal();

    drawBomb();

    drawPortal();

    drawSnake();

}


/* =========================================================
   UPDATE HUD
========================================================= */

function updateHUD(){

    scoreEl.innerText =
    score;

    level =
    Math.floor(score / 50) + 1;

    levelEl.innerText =
    level;

    bestEl.innerText =
    best;


    const powers=[];


    if(shieldActive)
        powers.push("🛡 SHIELD");


    if(speedBoost)
        powers.push("⚡ SPEED");


    if(paused)
        powers.push("⏸ PAUSED");


    powerBar.innerHTML =
    powers
    .map(
        p =>
        `<div class="power">${p}</div>`
    )
    .join("");

}


/* =========================================================
   MOVE SNAKE
========================================================= */

function moveSnake(){

    if(!gameRunning || paused)
        return;


    direction =
    nextDirection;


    const head = {

        x:
        snake[0].x,

        y:
        snake[0].y

    };


    if(direction==="UP")
        head.y--;

    if(direction==="DOWN")
        head.y++;

    if(direction==="LEFT")
        head.x--;

    if(direction==="RIGHT")
        head.x++;


    /* WALL */

    if(
        head.x < 0 ||
        head.x >= GRID ||
        head.y < 0 ||
        head.y >= GRID
    ){

        if(shieldActive){

            shieldActive=false;

            head.x =
            Math.max(
                0,
                Math.min(
                    GRID-1,
                    head.x
                )
            );

            head.y =
            Math.max(
                0,
                Math.min(
                    GRID-1,
                    head.y
                )
            );

        }

        else{

            gameOver();

            return;

        }

    }


    /* SELF COLLISION */

    if(
        snake.some(
            (part,index)=>
            index>0 &&
            part.x===head.x &&
            part.y===head.y
        )
    ){

        if(shieldActive){

            shieldActive=false;

        }

        else{

            gameOver();

            return;

        }

    }


    snake.unshift(head);


    let ate=false;


    /* FOOD */

    if(
        food &&
        head.x===food.x &&
        head.y===food.y
    ){

        score += 10;

        ate=true;

        food =
        safePosition();


        /* RANDOM POWER */

        const chance =
        Math.random();


        if(chance < .20){

            crystal =
            safePosition();

        }

        else if(chance < .35){

            shieldActive=true;

        }

        else if(chance < .45){

            speedBoost=true;

            setTimeout(
                ()=>{
                    speedBoost=false;
                    updateHUD();
                },
                5000
            );

        }

    }


    /* CRYSTAL */

    if(
        crystal &&
        head.x===crystal.x &&
        head.y===crystal.y
    ){

        score += 25;

        crystal=null;

        ate=true;

    }


    /* BOMB */

    if(
        bomb &&
        head.x===bomb.x &&
        head.y===bomb.y
    ){

        gameOver();

        return;

    }


    /* PORTAL */

    if(
        portal &&
        head.x===portal.x &&
        head.y===portal.y
    ){

        const pos =
        safePosition();

        head.x =
        pos.x;

        head.y =
        pos.y;

        portal=null;

    }


    if(!ate){

        snake.pop();

    }


    /* LEVEL ITEMS */

    if(
        score>0 &&
        score%50===0
    ){

        if(!bomb)
            bomb=safePosition();

    }


    if(
        score>0 &&
        score%75===0
    ){

        if(!portal)
            portal=safePosition();

    }


    updateHUD();

    draw();

}


/* =========================================================
   GAME LOOP SPEED
========================================================= */

function getSpeed(){

    const base =
    Math.max(
        55,
        150 - (level-1)*10
    );

    return speedBoost
    ? Math.max(35,base-45)
    : base;

}


function restartLoop(){

    clearInterval(timer);

    timer =
    setInterval(
        moveSnake,
        getSpeed()
    );

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    clearInterval(timer);


    snake = [

        {
            x:10,
            y:10
        },

        {
            x:9,
            y:10
        },

        {
            x:8,
            y:10
        }

    ];


    direction="RIGHT";

    nextDirection="RIGHT";

    score=0;

    level=1;

    paused=false;

    gameRunning=true;

    shieldActive=false;

    speedBoost=false;

    createItems();


    startScreen
    .classList
    .add("hidden");

    gameOverScreen
    .classList
    .add("hidden");


    updateHUD();

    draw();

    restartLoop();

}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    gameRunning=false;

    paused=false;

    clearInterval(timer);


    if(score>best){

        best=score;

        localStorage.setItem(
            "neonSnakeBest",
            best
        );

    }


    finalScoreEl.innerText =
    score;

    bestEl.innerText =
    best;


    gameOverScreen
    .classList
    .remove("hidden");

}


/* =========================================================
   PAUSE
========================================================= */

function pauseGame(){

    if(!gameRunning)
        return;


    paused=!paused;


    pauseBtn.innerText =
    paused
    ? "▶ RESUME"
    : "⏸ PAUSE";


    updateHUD();

}


/* =========================================================
   SAFE DIRECTION CHANGE
========================================================= */

function changeDirection(newDirection){

    if(!gameRunning || paused)
        return;


    if(
        newDirection==="UP" &&
        direction!=="DOWN"
    ){

        nextDirection="UP";

    }


    if(
        newDirection==="DOWN" &&
        direction!=="UP"
    ){

        nextDirection="DOWN";

    }


    if(
        newDirection==="LEFT" &&
        direction!=="RIGHT"
    ){

        nextDirection="LEFT";

    }


    if(
        newDirection==="RIGHT" &&
        direction!=="LEFT"
    ){

        nextDirection="RIGHT";

    }

}


/* =========================================================
   KEYBOARD CONTROL
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        const key =
        event.key;


        if(
            [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
                " "
            ].includes(key)
        ){

            event.preventDefault();

        }


        if(key==="ArrowUp")
            changeDirection("UP");

        if(key==="ArrowDown")
            changeDirection("DOWN");

        if(key==="ArrowLeft")
            changeDirection("LEFT");

        if(key==="ArrowRight")
            changeDirection("RIGHT");

        if(key===" ")
            pauseGame();

    }
);


/* =========================================================
   MOBILE BUTTON CONTROL
========================================================= */

document
.querySelectorAll(
    ".mobile-controls button"
)
.forEach(
    button=>{

        const handlePress =
        function(event){

            event.preventDefault();

            const dir =
            button.dataset.dir;


            if(dir==="up")
                changeDirection("UP");

            if(dir==="down")
                changeDirection("DOWN");

            if(dir==="left")
                changeDirection("LEFT");

            if(dir==="right")
                changeDirection("RIGHT");

        };


        button.addEventListener(
            "touchstart",
            handlePress,
            {
                passive:false
            }
        );


        button.addEventListener(
            "click",
            handlePress
        );

    }
);


/* =========================================================
   SWIPE CONTROL
========================================================= */

let touchStartX=0;

let touchStartY=0;


canvas.addEventListener(
    "touchstart",
    function(event){

        const touch =
        event.changedTouches[0];

        touchStartX =
        touch.clientX;

        touchStartY =
        touch.clientY;

    },
    {
        passive:true
    }
);


canvas.addEventListener(
    "touchend",
    function(event){

        const touch =
        event.changedTouches[0];

        const dx =
        touch.clientX -
        touchStartX;

        const dy =
        touch.clientY -
        touchStartY;


        const minSwipe=25;


        if(
            Math.abs(dx)<minSwipe &&
            Math.abs(dy)<minSwipe
        ){

            return;

        }


        if(
            Math.abs(dx)>Math.abs(dy)
        ){

            if(dx>0)
                changeDirection("RIGHT");

            else
                changeDirection("LEFT");

        }

        else{

            if(dy>0)
                changeDirection("DOWN");

            else
                changeDirection("UP");

        }

    },
    {
        passive:true
    }
);


/* =========================================================
   BUTTON EVENTS
========================================================= */

startBtn.onclick =
startGame;

restartBtn.onclick =
startGame;

playBtn.onclick =
startGame;

pauseBtn.onclick =
pauseGame;


/* =========================================================
   INITIAL SCREEN
========================================================= */

bestEl.innerText =
best;

draw();


/* =========================================================
   SERVICE WORKER
========================================================= */

if(
    "serviceWorker"
    in navigator
){

    window.addEventListener(
        "load",
        function(){

            navigator
            .serviceWorker
            .register(
                "sw.js"
            )
            .catch(
                error =>
                console.log(
                    "Service Worker Error:",
                    error
                )
            );

        }
    );

}

</script>
