<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>NEON SNAKE | Cyber Arena</title>

<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    min-height:100%;
    background:#05070d;
}

body{
    min-height:100vh;
    min-height:100dvh;
    font-family:Arial, Helvetica, sans-serif;
    color:#ffffff;
    background:
        radial-gradient(circle at 50% 0%,
        rgba(0,220,255,.10),
        transparent 35%),
        #05070d;

    overflow-x:hidden;
    overflow-y:auto;
}

/* =========================================================
   BACKGROUND
========================================================= */

.background{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
}

.background::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(0,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,255,255,.025) 1px,
            transparent 1px
        );

    background-size:40px 40px;
}

.glow{
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.12;
}

.glow.one{
    background:#00eaff;
    top:-200px;
    left:-150px;
}

.glow.two{
    background:#7c3cff;
    right:-180px;
    bottom:-200px;
}

/* =========================================================
   MAIN
========================================================= */

.page{
    position:relative;
    z-index:2;

    min-height:100vh;
    min-height:100dvh;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:25px 12px 40px;
}

.game-card{
    width:100%;
    max-width:620px;

    background:
        linear-gradient(
            145deg,
            rgba(17,24,39,.96),
            rgba(5,10,20,.97)
        );

    border:1px solid rgba(0,230,255,.18);

    border-radius:28px;

    padding:25px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.04);
}

/* =========================================================
   HEADER
========================================================= */

.header{
    text-align:center;
    margin-bottom:22px;
}

.brand{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.brand-mark{
    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(0,238,255,.4);
    border-radius:12px;

    color:#00eaff;

    font-size:22px;
    font-weight:bold;

    box-shadow:
        0 0 25px rgba(0,238,255,.18);

    background:
        rgba(0,238,255,.05);
}

.brand h1{
    font-size:28px;
    letter-spacing:5px;
    font-weight:800;
}

.subtitle{
    margin-top:7px;

    font-size:10px;
    letter-spacing:4px;

    color:#718096;

    text-transform:uppercase;
}

/* =========================================================
   HUD
========================================================= */

.hud{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;

    margin-bottom:16px;
}

.hud-box{
    padding:13px 8px;

    text-align:center;

    background:#0a101b;

    border:1px solid rgba(255,255,255,.06);

    border-radius:14px;
}

.hud-label{
    font-size:9px;
    letter-spacing:2px;
    color:#667085;
    text-transform:uppercase;
}

.hud-value{
    margin-top:5px;

    font-size:21px;
    font-weight:700;

    color:#e8fbff;
}

/* =========================================================
   STATUS
========================================================= */

.status{
    height:24px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:10px;

    font-size:10px;
    letter-spacing:2px;

    color:#5ee7ff;

    text-transform:uppercase;
}

/* =========================================================
   GAME AREA
========================================================= */

.game-container{
    width:100%;

    display:flex;
    justify-content:center;
}

canvas{
    width:100%;
    max-width:500px;
    height:auto;

    display:block;

    background:#03070d;

    border:1px solid rgba(0,230,255,.22);

    border-radius:20px;

    box-shadow:
        0 0 35px rgba(0,220,255,.08),
        inset 0 0 60px rgba(0,0,0,.7);

    touch-action:none;
}

/* =========================================================
   BUTTONS
========================================================= */

.actions{
    display:flex;
    justify-content:center;
    gap:10px;

    margin-top:18px;
}

.action-btn{
    flex:1;

    max-width:180px;

    padding:13px 18px;

    border-radius:12px;

    border:1px solid rgba(0,230,255,.18);

    background:#0b121e;

    color:#dffaff;

    font-size:11px;
    font-weight:700;

    letter-spacing:1.5px;

    cursor:pointer;

    transition:.2s;
}

.action-btn:hover{
    border-color:rgba(0,230,255,.5);

    background:#0e1927;

    transform:translateY(-2px);
}

.action-btn:active{
    transform:scale(.96);
}

.primary{
    background:
        linear-gradient(
            135deg,
            rgba(0,220,255,.15),
            rgba(20,100,255,.12)
        );

    border-color:rgba(0,230,255,.35);
}

/* =========================================================
   MOBILE CONTROL
========================================================= */

.mobile-controls{
    width:100%;

    display:flex;
    flex-direction:column;
    align-items:center;

    margin-top:20px;

    user-select:none;
}

.control-row{
    display:flex;
    justify-content:center;
    gap:10px;

    margin-top:10px;
}

.control-btn{
    width:62px;
    height:54px;

    border-radius:14px;

    border:1px solid rgba(0,230,255,.18);

    background:#0a111c;

    color:#bdefff;

    font-size:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    box-shadow:
        0 8px 20px rgba(0,0,0,.25);

    touch-action:manipulation;

    transition:.12s;
}

.control-btn:active{
    transform:scale(.90);

    background:#102333;

    border-color:rgba(0,230,255,.55);

    box-shadow:
        0 0 25px rgba(0,230,255,.18);
}

.control-empty{
    width:62px;
    height:54px;
}

/* =========================================================
   POWER STATUS
========================================================= */

.power-area{
    min-height:25px;

    display:flex;
    justify-content:center;

    gap:8px;

    margin-top:12px;
}

.power{
    padding:5px 10px;

    border-radius:20px;

    background:#0b1721;

    border:1px solid rgba(0,230,255,.15);

    color:#8cefff;

    font-size:9px;

    letter-spacing:1px;
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
    text-align:center;

    margin-top:20px;

    font-size:9px;

    color:#465366;

    letter-spacing:2px;

    text-transform:uppercase;
}

/* =========================================================
   OVERLAY
========================================================= */

.overlay{
    position:fixed;

    inset:0;

    z-index:50;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(2,5,10,.82);

    backdrop-filter:blur(12px);
}

.overlay-card{
    width:100%;
    max-width:400px;

    padding:35px 25px;

    text-align:center;

    background:#0a101b;

    border:1px solid rgba(0,230,255,.2);

    border-radius:24px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.7);
}

.overlay-icon{
    font-size:38px;

    color:#00eaff;

    margin-bottom:15px;
}

.overlay h2{
    font-size:24px;

    letter-spacing:3px;

    margin-bottom:10px;
}

.overlay p{
    color:#718096;

    font-size:12px;

    line-height:1.7;
}

.overlay button{
    margin-top:25px;

    width:100%;

    padding:14px;

    border-radius:12px;

    border:1px solid rgba(0,230,255,.35);

    background:#0c1d2a;

    color:#dffaff;

    font-weight:bold;

    letter-spacing:1px;

    cursor:pointer;
}

.hidden{
    display:none !important;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .page{
        padding:10px 7px 30px;
    }

    .game-card{
        padding:16px 12px 20px;
        border-radius:22px;
    }

    .brand h1{
        font-size:21px;
        letter-spacing:3px;
    }

    .brand-mark{
        width:36px;
        height:36px;
        font-size:18px;
    }

    .subtitle{
        font-size:8px;
        letter-spacing:3px;
    }

    .hud{
        gap:7px;
    }

    .hud-box{
        padding:10px 5px;
        border-radius:12px;
    }

    .hud-label{
        font-size:8px;
        letter-spacing:1px;
    }

    .hud-value{
        font-size:18px;
    }

    canvas{
        border-radius:16px;
    }

    .actions{
        gap:8px;
    }

    .action-btn{
        padding:12px 8px;
        font-size:10px;
    }

    .control-btn,
    .control-empty{
        width:58px;
        height:52px;
    }

}

@media(max-width:380px){

    .brand h1{
        font-size:18px;
    }

    .control-btn,
    .control-empty{
        width:52px;
        height:48px;
    }

    .control-row{
        gap:8px;
    }

}

</style>
</head>

<body>

<div class="background">
    <div class="glow one"></div>
    <div class="glow two"></div>
</div>

<div class="page">

<div class="game-card">

    <!-- HEADER -->

    <div class="header">

        <div class="brand">

            <div class="brand-mark">N</div>

            <h1>NEON SNAKE</h1>

        </div>

        <div class="subtitle">
            CYBER ARENA · SYSTEM 01
        </div>

    </div>


    <!-- HUD -->

    <div class="hud">

        <div class="hud-box">
            <div class="hud-label">Score</div>
            <div class="hud-value" id="score">0</div>
        </div>

        <div class="hud-box">
            <div class="hud-label">Level</div>
            <div class="hud-value" id="level">1</div>
        </div>

        <div class="hud-box">
            <div class="hud-label">Best</div>
            <div class="hud-value" id="best">0</div>
        </div>

    </div>


    <div class="status" id="status">
        READY
    </div>


    <!-- GAME -->

    <div class="game-container">

        <canvas
            id="game"
            width="500"
            height="500">
        </canvas>

    </div>


    <!-- POWER STATUS -->

    <div class="power-area" id="powerArea"></div>


    <!-- BUTTONS -->

    <div class="actions">

        <button
            class="action-btn primary"
            id="playBtn">
            ▶ PLAY
        </button>

        <button
            class="action-btn"
            id="pauseBtn">
            ⏸ PAUSE
        </button>

    </div>


    <!-- MOBILE CONTROLS -->

    <div class="mobile-controls">

        <div class="control-row">

            <button
                class="control-btn"
                data-direction="UP">
                ▲
            </button>

        </div>


        <div class="control-row">

            <button
                class="control-btn"
                data-direction="LEFT">
                ◀
            </button>

            <div class="control-empty"></div>

            <button
                class="control-btn"
                data-direction="RIGHT">
                ▶
            </button>

        </div>


        <div class="control-row">

            <button
                class="control-btn"
                data-direction="DOWN">
                ▼
            </button>

        </div>

    </div>


    <div class="footer">
        TOUCH CONTROLS · ARROW KEYS · SPACE TO PAUSE
    </div>

</div>

</div>


<!-- START SCREEN -->

<div class="overlay" id="startScreen">

    <div class="overlay-card">

        <div class="overlay-icon">
            ◈
        </div>

        <h2>NEON SNAKE</h2>

        <p>
            Enter the cyber arena.<br>
            Collect energy. Grow your snake.<br>
            Survive as long as possible.
        </p>

        <button id="startBtn">
            ENTER ARENA
        </button>

    </div>

</div>


<!-- GAME OVER -->

<div class="overlay hidden" id="gameOverScreen">

    <div class="overlay-card">

        <div class="overlay-icon">
            ×
        </div>

        <h2>SYSTEM OFFLINE</h2>

        <p>
            Your run has ended.
        </p>

        <p style="
            margin-top:15px;
            color:#ffffff;
            font-size:22px;
            font-weight:bold;
        ">
            SCORE:
            <span id="finalScore">0</span>
        </p>

        <button id="restartBtn">
            RESTART SYSTEM
        </button>

    </div>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


/* =========================================================
   DOM
========================================================= */

const scoreEl =
    document.getElementById("score");

const levelEl =
    document.getElementById("level");

const bestEl =
    document.getElementById("best");

const statusEl =
    document.getElementById("status");

const powerArea =
    document.getElementById("powerArea");

const startScreen =
    document.getElementById("startScreen");

const gameOverScreen =
    document.getElementById("gameOverScreen");

const finalScoreEl =
    document.getElementById("finalScore");

const playBtn =
    document.getElementById("playBtn");

const pauseBtn =
    document.getElementById("pauseBtn");

const startBtn =
    document.getElementById("startBtn");

const restartBtn =
    document.getElementById("restartBtn");


/* =========================================================
   GAME VARIABLES
========================================================= */

const GRID = 25;
const SIZE = 20;

let snake = [];

let direction = "RIGHT";
let nextDirection = "RIGHT";

let food = null;

let score = 0;
let level = 1;

let best =
    Number(localStorage.getItem("neonSnakeBest")) || 0;

let running = false;
let paused = false;

let timer = null;

let particles = [];


/* =========================================================
   BEST SCORE
========================================================= */

bestEl.textContent = best;


/* =========================================================
   RANDOM POSITION
========================================================= */

function randomPosition(){

    return {

        x:Math.floor(Math.random()*GRID)*SIZE,

        y:Math.floor(Math.random()*GRID)*SIZE

    };

}


function positionFree(pos){

    return !snake.some(
        part =>
        part.x === pos.x &&
        part.y === pos.y
    );

}


function spawnFood(){

    let pos;

    do{

        pos = randomPosition();

    }while(!positionFree(pos));

    food = pos;

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(x,y){

    for(let i=0;i<10;i++){

        particles.push({

            x:x+10,

            y:y+10,

            vx:(Math.random()-.5)*3,

            vy:(Math.random()-.5)*3,

            life:1

        });

    }

}


function updateParticles(){

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.life-=.045;

        if(p.life<=0){

            particles.splice(i,1);

        }

    }

}


function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha=p.life;

        ctx.fillStyle="#00eaff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            2.5,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;

}


/* =========================================================
   GRID
========================================================= */

function drawGrid(){

    ctx.strokeStyle="rgba(0,230,255,.035)";
    ctx.lineWidth=1;

    for(let i=0;i<=500;i+=SIZE){

        ctx.beginPath();

        ctx.moveTo(i,0);
        ctx.lineTo(i,500);

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(0,i);
        ctx.lineTo(500,i);

        ctx.stroke();

    }

}


/* =========================================================
   FOOD
========================================================= */

function drawFood(){

    if(!food)return;

    const cx=food.x+10;
    const cy=food.y+10;

    const pulse=
        7+
        Math.sin(Date.now()/180)*2;

    ctx.save();

    ctx.shadowBlur=25;

    ctx.shadowColor="#00eaff";

    ctx.fillStyle="#00eaff";

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        pulse,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.fillStyle="#ffffff";

    ctx.beginPath();

    ctx.arc(
        cx-2,
        cy-2,
        2.5,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* =========================================================
   SNAKE
========================================================= */

function drawSnake(){

    for(let i=snake.length-1;i>=0;i--){

        const part=snake[i];

        const head=i===0;

        const size=head?17:15;

        const offset=(20-size)/2;

        const gradient=
            ctx.createLinearGradient(
                part.x,
                part.y,
                part.x+20,
                part.y+20
            );

        if(head){

            gradient.addColorStop(
                0,
                "#ffffff"
            );

            gradient.addColorStop(
                .3,
                "#65f5ff"
            );

            gradient.addColorStop(
                1,
                "#008cff"
            );

        }else{

            gradient.addColorStop(
                0,
                "#37eaff"
            );

            gradient.addColorStop(
                1,
                "#1267d8"
            );

        }

        ctx.save();

        ctx.shadowBlur=head?28:16;

        ctx.shadowColor=
            head
            ? "#00eaff"
            : "#008cff";

        ctx.fillStyle=gradient;

        roundRect(
            ctx,
            part.x+offset,
            part.y+offset,
            size,
            size,
            head?7:6
        );

        ctx.fill();

        ctx.restore();


        /* HEAD */

        if(head){

            drawEyes(part);

        }

    }

}


/* =========================================================
   SNAKE EYES
========================================================= */

function drawEyes(head){

    ctx.save();

    let e1;
    let e2;

    if(direction==="RIGHT"){

        e1={x:head.x+14,y:head.y+6};
        e2={x:head.x+14,y:head.y+14};

    }

    else if(direction==="LEFT"){

        e1={x:head.x+6,y:head.y+6};
        e2={x:head.x+6,y:head.y+14};

    }

    else if(direction==="UP"){

        e1={x:head.x+6,y:head.y+6};
        e2={x:head.x+14,y:head.y+6};

    }

    else{

        e1={x:head.x+6,y:head.y+14};
        e2={x:head.x+14,y:head.y+14};

    }

    ctx.fillStyle="#04111c";

    ctx.beginPath();

    ctx.arc(e1.x,e1.y,2.2,0,Math.PI*2);

    ctx.fill();

    ctx.beginPath();

    ctx.arc(e2.x,e2.y,2.2,0,Math.PI*2);

    ctx.fill();

    ctx.restore();

}


/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(
    ctx,
    x,
    y,
    w,
    h,
    r
){

    ctx.beginPath();

    ctx.moveTo(x+r,y);

    ctx.arcTo(
        x+w,y,
        x+w,y+h,
        r
    );

    ctx.arcTo(
        x+w,y+h,
        x,y+h,
        r
    );

    ctx.arcTo(
        x,y+h,
        x,y,
        r
    );

    ctx.arcTo(
        x,y,
        x+w,y,
        r
    );

    ctx.closePath();

}


/* =========================================================
   DRAW SCENE
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawGrid();

    drawFood();

    drawSnake();

    updateParticles();

    drawParticles();

}


/* =========================================================
   COLLISION
========================================================= */

function hitSelf(head){

    for(let i=1;i<snake.length;i++){

        if(
            head.x===snake[i].x &&
            head.y===snake[i].y
        ){

            return true;

        }

    }

    return false;

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameStep(){

    if(!running || paused)return;


    direction=nextDirection;


    const head={
        x:snake[0].x,
        y:snake[0].y
    };


    if(direction==="UP")
        head.y-=SIZE;

    if(direction==="DOWN")
        head.y+=SIZE;

    if(direction==="LEFT")
        head.x-=SIZE;

    if(direction==="RIGHT")
        head.x+=SIZE;


    /* WALL */

    if(
        head.x<0 ||
        head.x>=500 ||
        head.y<0 ||
        head.y>=500
    ){

        gameOver();

        return;

    }


    /* SELF */

    if(hitSelf(head)){

        gameOver();

        return;

    }


    snake.unshift(head);


    /* FOOD */

    if(
        food &&
        head.x===food.x &&
        head.y===food.y
    ){

        score+=10;

        createParticles(
            food.x,
            food.y
        );

        spawnFood();

        updateLevel();

    }else{

        snake.pop();

    }


    draw();

    updateHUD();

}


/* =========================================================
   LEVEL
========================================================= */

function updateLevel(){

    const newLevel=
        Math.floor(score/100)+1;

    if(newLevel!==level){

        level=newLevel;

        statusEl.textContent=
            "LEVEL "+level;

        resetTimer();

    }

}


/* =========================================================
   TIMER
========================================================= */

function resetTimer(){

    if(timer){

        clearInterval(timer);

    }

    if(!running)return;

    const speed=
        Math.max(
            55,
            130-(level*8)
        );

    timer=
        setInterval(
            gameStep,
            speed
        );

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    scoreEl.textContent=score;

    levelEl.textContent=level;

    bestEl.textContent=best;

    powerArea.innerHTML="";

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    startScreen.classList.add("hidden");

    gameOverScreen.classList.add("hidden");


    snake=[

        {x:200,y:240},

        {x:180,y:240},

        {x:160,y:240},

        {x:140,y:240}

    ];


    direction="RIGHT";

    nextDirection="RIGHT";

    score=0;

    level=1;

    paused=false;

    particles=[];

    running=true;


    spawnFood();

    updateHUD();


    statusEl.textContent=
        "SYSTEM ONLINE";


    resetTimer();

    draw();

}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(!running)return;

    paused=!paused;


    if(paused){

        clearInterval(timer);

        statusEl.textContent=
            "SYSTEM PAUSED";

    }else{

        statusEl.textContent=
            "SYSTEM ONLINE";

        resetTimer();

    }

}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    running=false;

    paused=false;


    if(timer){

        clearInterval(timer);

        timer=null;

    }


    if(score>best){

        best=score;

        localStorage.setItem(
            "neonSnakeBest",
            best
        );

    }


    finalScoreEl.textContent=score;

    bestEl.textContent=best;

    statusEl.textContent=
        "SYSTEM OFFLINE";


    gameOverScreen.classList.remove(
        "hidden"
    );

}


/* =========================================================
   DIRECTION
========================================================= */

function setDirection(dir){

    if(!running || paused)return;


    const opposite={

        UP:"DOWN",

        DOWN:"UP",

        LEFT:"RIGHT",

        RIGHT:"LEFT"

    };


    if(
        dir!==opposite[direction]
    ){

        nextDirection=dir;

    }

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key==="ArrowUp"){

            e.preventDefault();

            setDirection("UP");

        }

        else if(e.key==="ArrowDown"){

            e.preventDefault();

            setDirection("DOWN");

        }

        else if(e.key==="ArrowLeft"){

            e.preventDefault();

            setDirection("LEFT");

        }

        else if(e.key==="ArrowRight"){

            e.preventDefault();

            setDirection("RIGHT");

        }

        else if(
            e.key===" " ||
            e.code==="Space"
        ){

            e.preventDefault();

            togglePause();

        }

    }
);


/* =========================================================
   MOBILE CONTROLS
========================================================= */

document
.querySelectorAll("[data-direction]")
.forEach(button=>{

    function press(e){

        e.preventDefault();

        const dir=
            button.getAttribute(
                "data-direction"
            );

        setDirection(dir);

    }


    button.addEventListener(
        "pointerdown",
        press,
        {passive:false}
    );

});


/* =========================================================
   BUTTONS
========================================================= */

playBtn.addEventListener(
    "click",
    startGame
);

startBtn.addEventListener(
    "click",
    startGame
);

restartBtn.addEventListener(
    "click",
    startGame
);

pauseBtn.addEventListener(
    "click",
    togglePause
);


/* =========================================================
   INITIAL SCREEN
========================================================= */

(function(){

    draw();

})();

</script>

</body>
</html>
