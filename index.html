<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- APP / BROWSER ICON -->
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="manifest" href="./manifest.json">

    <meta name="theme-color" content="#080b24">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>HOLO SNAKE · Aurora</title>

    <!-- MODERN FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        /* =====================================================
           ROOT
        ===================================================== */

        :root {
            --glass-bg: rgba(10, 14, 38, 0.78);
            --text-primary: #f4f7ff;
            --text-muted: #9da9ca;
            --border-angle: 0deg;
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: #050716;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            font-family: "Inter", sans-serif;

            color: var(--text-primary);

            background: #050716;

            overflow-x: hidden;
            overflow-y: auto;

            -webkit-overflow-scrolling: touch;

            overscroll-behavior-y: contain;
        }


        /* =====================================================
           AURORA BACKGROUND
        ===================================================== */

        .aurora-bg {
            position: fixed;
            inset: 0;

            z-index: 0;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(80, 60, 180, .28),
                    transparent 34%
                ),
                radial-gradient(
                    circle at 80% 25%,
                    rgba(0, 180, 255, .20),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 50% 90%,
                    rgba(220, 0, 180, .16),
                    transparent 38%
                ),
                #050716;
        }

        .aurora-bg::before {
            content: "";

            position: absolute;
            inset: -30%;

            background:
                radial-gradient(
                    ellipse at 25% 45%,
                    rgba(120, 60, 255, .32),
                    transparent 42%
                ),
                radial-gradient(
                    ellipse at 75% 25%,
                    rgba(0, 210, 255, .24),
                    transparent 38%
                ),
                radial-gradient(
                    ellipse at 55% 80%,
                    rgba(255, 0, 190, .18),
                    transparent 40%
                );

            filter: blur(70px);

            animation:
                auroraMove 18s ease-in-out infinite alternate;
        }

        .aurora-bg::after {
            content: "";

            position: absolute;
            inset: 0;

            opacity: .10;

            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");

            background-size: 180px 180px;

            pointer-events: none;
        }

        @keyframes auroraMove {

            0% {
                transform:
                    translate(-5%, -5%)
                    rotate(-5deg)
                    scale(1.15);
            }

            50% {
                transform:
                    translate(8%, 6%)
                    rotate(7deg)
                    scale(1.1);
            }

            100% {
                transform:
                    translate(-8%, 8%)
                    rotate(-3deg)
                    scale(1.25);
            }
        }


        /* =====================================================
           GAME WRAPPER
        ===================================================== */

        .game-wrapper {
            width: 100%;

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;

            justify-content: center;
            align-items: flex-start;

            position: relative;

            z-index: 1;

            padding:
                18px
                12px
                calc(40px + env(safe-area-inset-bottom));
        }


        /* =====================================================
           GAME PANEL
        ===================================================== */

        .game-panel {
            position: relative;

            width: 100%;
            max-width: 660px;

            padding: 28px 24px 26px;

            border-radius: 38px;

            background: var(--glass-bg);

            backdrop-filter:
                blur(30px)
                saturate(1.4);

            -webkit-backdrop-filter:
                blur(30px)
                saturate(1.4);

            border:
                1px solid
                rgba(255,255,255,.07);

            box-shadow:
                0 20px 70px rgba(0,0,0,.55),
                inset 0 1px 0 rgba(255,255,255,.06);

            overflow: visible;
        }

        .game-panel::before {
            content: "";

            position: absolute;

            inset: -1px;

            z-index: -1;

            border-radius: 39px;

            padding: 1px;

            background:
                conic-gradient(
                    from var(--border-angle),
                    rgba(130,80,255,.65),
                    rgba(0,220,255,.65),
                    rgba(255,0,190,.55),
                    rgba(255,200,0,.45),
                    rgba(130,80,255,.65)
                );

            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);

            -webkit-mask-composite: xor;

            mask-composite: exclude;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {
            text-align: center;

            position: relative;

            z-index: 3;

            margin-bottom: 18px;
        }

        .logo-image {
            width: 92px;
            height: 92px;

            object-fit: contain;

            display: block;

            margin: 0 auto 10px;

            border-radius: 24px;

            filter:
                drop-shadow(
                    0 0 25px
                    rgba(130,90,255,.65)
                );

            animation:
                logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {

            0%,100% {
                transform:
                    translateY(0)
                    scale(1);
            }

            50% {
                transform:
                    translateY(-5px)
                    scale(1.04);
            }
        }

        .logo h1 {
            font-family: "Orbitron", sans-serif;

            font-size: 31px;

            font-weight: 900;

            letter-spacing: 5px;

            background:
                linear-gradient(
                    135deg,
                    #c084fc,
                    #60a5fa,
                    #f472b6
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            background-clip: text;
        }

        .creator {
            margin-top: 7px;

            font-family: "Orbitron", sans-serif;

            font-size: 10px;

            letter-spacing: 3px;

            color: rgba(255,255,255,.72);

            text-transform: uppercase;
        }

        .creator span {
            color: #c084fc;

            text-shadow:
                0 0 14px
                rgba(192,132,252,.7);
        }

        .logo p {
            margin-top: 7px;

            font-family: "Orbitron", sans-serif;

            font-size: 9px;

            letter-spacing: 5px;

            color: var(--text-muted);

            opacity: .65;

            text-transform: uppercase;
        }


        /* =====================================================
           HUD
        ===================================================== */

        .hud {
            display: grid;

            grid-template-columns:
                repeat(3,1fr);

            gap: 9px;

            margin-bottom: 12px;

            position: relative;

            z-index: 2;
        }

        .hud-box {
            padding: 11px 6px;

            text-align: center;

            border-radius: 18px;

            background:
                rgba(255,255,255,.035);

            border:
                1px solid
                rgba(255,255,255,.06);
        }

        .hud-title {
            font-size: 8px;

            font-weight: 600;

            letter-spacing: 2px;

            color: var(--text-muted);

            text-transform: uppercase;
        }

        .hud-value {
            margin-top: 3px;

            font-family: "Orbitron", sans-serif;

            font-size: 19px;

            font-weight: 700;

            color: #e5e7ff;

            text-shadow:
                0 0 14px
                rgba(130,100,255,.5);
        }


        /* =====================================================
           POWER BAR
        ===================================================== */

        .power-bar {
            min-height: 26px;

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 6px;

            margin-bottom: 10px;
        }

        .power {
            padding: 5px 12px;

            border-radius: 30px;

            font-size: 9px;

            letter-spacing: 1px;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid
                rgba(255,255,255,.07);

            color: #dbe4ff;
        }


        /* =====================================================
           CANVAS
        ===================================================== */

        .canvas-wrapper {
            width: 100%;

            display: flex;

            justify-content: center;

            position: relative;

            z-index: 2;
        }

        canvas {
            display: block;

            width: min(
                100%,
                500px
            );

            height: auto;

            aspect-ratio: 1 / 1;

            border-radius: 26px;

            background:
                rgba(0,0,0,.43);

            border:
                1px solid
                rgba(255,255,255,.06);

            box-shadow:
                inset 0 0 55px rgba(0,0,0,.6),
                0 0 35px rgba(100,70,255,.12);

            touch-action: none;
        }


        /* =====================================================
           DESKTOP BUTTONS
        ===================================================== */

        .button-area {
            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 18px;

            position: relative;

            z-index: 4;
        }

        button {
            border: none;

            padding: 13px 27px;

            min-width: 120px;

            border-radius: 50px;

            font-family: "Inter", sans-serif;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 1px;

            text-transform: uppercase;

            color: white;

            cursor: pointer;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid
                rgba(255,255,255,.08);

            box-shadow:
                0 6px 20px
                rgba(0,0,0,.25);

            transition:
                transform .2s ease,
                background .2s ease;
            
            touch-action: manipulation;

            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            transform: translateY(-2px);

            background:
                rgba(255,255,255,.09);
        }

        button:active {
            transform: scale(.94);
        }

        .btn-primary {
            background:
                linear-gradient(
                    135deg,
                    rgba(125,70,255,.42),
                    rgba(0,190,255,.22)
                );

            border-color:
                rgba(145,100,255,.4);
        }


        /* =====================================================
           MOBILE CONTROLS
        ===================================================== */

        .mobile-controls {
            display: none;

            width: 100%;

            margin-top: 15px;

            position: relative;

            z-index: 5;

            user-select: none;

            -webkit-user-select: none;

            touch-action: manipulation;
        }

        .control-row {
            display: flex;

            justify-content: center;

            gap: 9px;

            margin-top: 8px;
        }

        .control-btn {
            width: 58px;
            height: 58px;

            min-width: 58px;

            padding: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 19px;

            font-size: 24px;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid
                rgba(255,255,255,.09);

            color: #edf0ff;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.25);
        }

        .control-btn:active {
            transform: scale(.88);

            background:
                rgba(130,90,255,.28);
        }


        /* =====================================================
           SCREENS
        ===================================================== */

        .screen {
            position: fixed;

            inset: 0;

            z-index: 100;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(3,4,18,.78);

            backdrop-filter:
                blur(22px);

            -webkit-backdrop-filter:
                blur(22px);
        }

        .screen-card {
            width: 100%;

            max-width: 430px;

            padding: 42px 28px;

            text-align: center;

            border-radius: 38px;

            background:
                rgba(10,12,35,.86);

            border:
                1px solid
                rgba(255,255,255,.08);

            box-shadow:
                0 30px 90px
                rgba(0,0,0,.6);

            animation:
                popIn .45s ease;
        }

        @keyframes popIn {

            from {
                opacity: 0;

                transform:
                    scale(.9)
                    translateY(20px);
            }

            to {
                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }
        }

        .screen-icon {
            font-size: 60px;

            margin-bottom: 8px;

            filter:
                drop-shadow(
                    0 0 25px
                    rgba(140,90,255,.6)
                );
        }

        .screen-card h2 {
            font-family: "Orbitron", sans-serif;

            font-size: 26px;

            font-weight: 900;

            letter-spacing: 3px;

            background:
                linear-gradient(
                    135deg,
                    #c084fc,
                    #60a5fa
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            background-clip: text;
        }

        .screen-card p {
            margin-top: 12px;

            color: var(--text-muted);

            font-size: 13px;

            line-height: 1.7;
        }

        .screen-card button {
            margin-top: 25px;

            min-width: 190px;
        }

        .hidden {
            display: none !important;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 768px) {

            .game-wrapper {
                padding:
                    10px
                    7px
                    calc(28px + env(safe-area-inset-bottom));
            }

            .game-panel {
                padding:
                    18px
                    12px
                    18px;

                border-radius: 28px;
            }

            .logo-image {
                width: 76px;
                height: 76px;

                border-radius: 20px;
            }

            .logo h1 {
                font-size: 22px;

                letter-spacing: 3px;
            }

            .creator {
                font-size: 8px;

                letter-spacing: 2px;
            }

            .logo p {
                font-size: 8px;

                letter-spacing: 3px;
            }

            .mobile-controls {
                display: block;
            }

            .button-area button {
                padding:
                    11px
                    17px;

                min-width: 105px;

                font-size: 10px;
            }

            canvas {
                border-radius: 22px;
            }
        }


        @media (max-width: 420px) {

            .game-panel {
                padding:
                    14px
                    9px
                    16px;
            }

            .logo-image {
                width: 68px;
                height: 68px;
            }

            .logo h1 {
                font-size: 19px;

                letter-spacing: 2px;
            }

            .hud-value {
                font-size: 16px;
            }

            .control-btn {
                width: 54px;
                height: 54px;

                min-width: 54px;

                font-size: 21px;

                border-radius: 17px;
            }

            .screen-card {
                padding:
                    32px
                    20px;
            }
        }

    </style>
</head>


<body>

    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="aurora-bg"></div>


    <!-- =====================================================
         GAME
    ====================================================== -->

    <main class="game-wrapper">

        <section class="game-panel">


            <!-- =================================================
                 LOGO
            ================================================== -->

            <div class="logo">

                <!-- YOUR RIYAJUL KHAN SNAKE LOGO -->
                <img
                    class="logo-image"
                    src="./icon.png"
                    alt="Riyajul Khan Snake Logo"
                    onerror="this.style.display='none';"
                >

                <h1>HOLO SNAKE</h1>

                <div class="creator">
                    CREATED BY
                    <span>RIYAJUL KHAN</span>
                </div>

                <p>AURORA PROTOCOL</p>

            </div>


            <!-- =================================================
                 HUD
            ================================================== -->

            <div class="hud">

                <div class="hud-box">
                    <div class="hud-title">
                        Score
                    </div>

                    <div
                        class="hud-value"
                        id="score">
                        0
                    </div>
                </div>


                <div class="hud-box">
                    <div class="hud-title">
                        Level
                    </div>

                    <div
                        class="hud-value"
                        id="level">
                        1
                    </div>
                </div>


                <div class="hud-box">
                    <div class="hud-title">
                        Best
                    </div>

                    <div
                        class="hud-value"
                        id="best">
                        0
                    </div>
                </div>

            </div>


            <!-- POWER BAR -->

            <div
                class="power-bar"
                id="powerBar">
            </div>


            <!-- =================================================
                 CANVAS
            ================================================== -->

            <div class="canvas-wrapper">

                <canvas
                    id="game"
                    width="500"
                    height="500">
                </canvas>

            </div>


            <!-- =================================================
                 MAIN BUTTONS
            ================================================== -->

            <div class="button-area">

                <button
                    class="btn-primary"
                    id="playBtn">
                    ▶ Play
                </button>

                <button
                    id="pauseBtn">
                    ⏸ Pause
                </button>

            </div>


            <!-- =================================================
                 MOBILE DIRECTION CONTROLS
            ================================================== -->

            <div
                class="mobile-controls"
                id="mobileControls">

                <div class="control-row">

                    <button
                        class="control-btn"
                        data-dir="up"
                        aria-label="Move Up">
                        ↑
                    </button>

                </div>


                <div class="control-row">

                    <button
                        class="control-btn"
                        data-dir="left"
                        aria-label="Move Left">
                        ←
                    </button>

                    <button
                        class="control-btn"
                        data-dir="down"
                        aria-label="Move Down">
                        ↓
                    </button>

                    <button
                        class="control-btn"
                        data-dir="right"
                        aria-label="Move Right">
                        →
                    </button>

                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         START SCREEN
    ====================================================== -->

    <div
        class="screen"
        id="startScreen">

        <div class="screen-card">

            <div class="screen-icon">
                🐍
            </div>

            <h2>
                HOLO ARENA
            </h2>

            <p>
                Navigate the neon arena.<br>
                Collect energy and survive.
            </p>

            <p>
                🔴 Food · 💎 Crystal · ⚡ Boost
            </p>

            <p>
                🛡️ Shield · 🌀 Portal · 💣 Bomb
            </p>

            <button
                class="btn-primary"
                id="startBtn">
                ▶ Enter Arena
            </button>

        </div>

    </div>


    <!-- =====================================================
         GAME OVER
    ====================================================== -->

    <div
        class="screen hidden"
        id="gameOverScreen">

        <div class="screen-card">

            <div class="screen-icon">
                💠
            </div>

            <h2>
                GAME OVER
            </h2>

            <p>
                Your final score
            </p>

            <h2
                id="finalScore"
                style="
                    margin-top:8px;
                    font-size:42px;
                    color:white;
                    -webkit-text-fill-color:white;
                    background:none;
                ">
                0
            </h2>

            <button
                class="btn-primary"
                id="restartBtn">
                ⟳ Reboot
            </button>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /* =====================================================
           CANVAS
        ===================================================== */

        const canvas =
            document.getElementById("game");

        const ctx =
            canvas.getContext("2d");


        /* =====================================================
           DOM
        ===================================================== */

        const scoreEl =
            document.getElementById("score");

        const levelEl =
            document.getElementById("level");

        const bestEl =
            document.getElementById("best");

        const powerBar =
            document.getElementById("powerBar");

        const finalScoreEl =
            document.getElementById("finalScore");

        const startScreen =
            document.getElementById("startScreen");

        const gameOverScreen =
            document.getElementById("gameOverScreen");

        const playBtn =
            document.getElementById("playBtn");

        const pauseBtn =
            document.getElementById("pauseBtn");

        const startBtn =
            document.getElementById("startBtn");

        const restartBtn =
            document.getElementById("restartBtn");


        /* =====================================================
           GAME STATE
        ===================================================== */

        const GRID = 25;
        const CELL = 20;

        let snake = [];

        let direction = "RIGHT";

        let nextDirection = "RIGHT";

        let score = 0;

        let level = 1;

        let gameRunning = false;

        let paused = false;

        let timer = null;

        let food = null;

        let crystal = null;

        let lightning = null;

        let shield = null;

        let bomb = null;

        let portal = null;

        let shieldActive = false;

        let speedBoost = false;

        let particles = [];


        /* =====================================================
           BEST SCORE
        ===================================================== */

        let best =
            Number(
                localStorage.getItem("snakeBest")
            ) || 0;

        bestEl.textContent = best;


        /* =====================================================
           RANDOM POSITION
        ===================================================== */

        function randomPosition() {

            return {

                x:
                    Math.floor(
                        Math.random() * GRID
                    ) * CELL,

                y:
                    Math.floor(
                        Math.random() * GRID
                    ) * CELL

            };
        }


        /* =====================================================
           CHECK SNAKE
        ===================================================== */

        function isOnSnake(pos) {

            return snake.some(
                part =>
                    part.x === pos.x &&
                    part.y === pos.y
            );
        }


        function randomSafePosition() {

            let pos;

            let tries = 0;

            do {

                pos =
                    randomPosition();

                tries++;

            } while (
                isOnSnake(pos) &&
                tries < 200
            );

            return pos;
        }


        /* =====================================================
           FOOD
        ===================================================== */

        function spawnFood() {

            food =
                randomSafePosition();
        }


        /* =====================================================
           POWER UPS
        ===================================================== */

        function clearPowerUps() {

            crystal = null;

            lightning = null;

            shield = null;

            bomb = null;

            portal = null;
        }


        function spawnPowerUp() {

            const active = [

                crystal,
                lightning,
                shield,
                bomb,
                portal

            ].filter(Boolean).length;


            if (active >= 2)
                return;


            const chance =
                Math.random();


            const pos =
                randomSafePosition();


            if (chance < .18) {

                crystal = pos;

            } else if (chance < .30) {

                lightning = pos;

            } else if (chance < .40) {

                shield = pos;

            } else if (chance < .50) {

                bomb = pos;

            } else if (chance < .58) {

                portal = pos;
            }
        }


        /* =====================================================
           PARTICLES
        ===================================================== */

        function addParticles(
            x,
            y,
            count = 2
        ) {

            for (
                let i = 0;
                i < count;
                i++
            ) {

                if (
                    particles.length > 80
                ) {
                    particles.shift();
                }


                particles.push({

                    x:
                        x + 10,

                    y:
                        y + 10,

                    vx:
                        (Math.random() - .5) * 2,

                    vy:
                        (Math.random() - .5) * 2,

                    life: 1,

                    size:
                        3 +
                        Math.random() * 5
                });
            }
        }


        function updateParticles() {

            for (
                let i = particles.length - 1;
                i >= 0;
                i--
            ) {

                const p =
                    particles[i];

                p.x += p.vx;

                p.y += p.vy;

                p.life -= .025;

                p.size *= .98;


                if (
                    p.life <= 0
                ) {

                    particles.splice(
                        i,
                        1
                    );
                }
            }
        }


        function drawParticles() {

            for (
                const p of particles
            ) {

                ctx.globalAlpha =
                    p.life;

                ctx.fillStyle =
                    "#9d7cff";

                ctx.shadowBlur = 15;

                ctx.shadowColor =
                    "#9d7cff";

                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    p.size,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }

            ctx.globalAlpha = 1;

            ctx.shadowBlur = 0;
        }


        /* =====================================================
           COLLISION
        ===================================================== */

        function hitSelf(head) {

            for (
                let i = 1;
                i < snake.length;
                i++
            ) {

                if (
                    snake[i].x === head.x &&
                    snake[i].y === head.y
                ) {

                    return true;
                }
            }

            return false;
        }


        /* =====================================================
           DRAW GRID
        ===================================================== */

        function drawGrid() {

            ctx.strokeStyle =
                "rgba(255,255,255,.035)";

            ctx.lineWidth = 1;


            for (
                let i = 0;
                i <= 500;
                i += CELL
            ) {

                ctx.beginPath();

                ctx.moveTo(i,0);

                ctx.lineTo(i,500);

                ctx.stroke();


                ctx.beginPath();

                ctx.moveTo(0,i);

                ctx.lineTo(500,i);

                ctx.stroke();
            }
        }


        /* =====================================================
           DRAW ITEM
        ===================================================== */

        function drawItem(
            item,
            color,
            emoji
        ) {

            if (!item)
                return;


            ctx.font =
                '22px "Segoe UI Emoji", Arial';


            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";


            ctx.shadowBlur = 25;

            ctx.shadowColor =
                color;


            ctx.fillText(
                emoji,
                item.x + 10,
                item.y + 10
            );


            ctx.shadowBlur = 0;
        }


        /* =====================================================
           DRAW SCENE
        ===================================================== */

        function drawScene() {

            ctx.clearRect(
                0,
                0,
                500,
                500
            );


            drawGrid();


            updateParticles();

            drawParticles();


            /* SNAKE */

            const time =
                Date.now() / 20;


            snake.forEach(
                (part, index) => {

                    const isHead =
                        index === 0;


                    const hue =
                        (
                            time +
                            index * 15
                        ) % 360;


                    const color =
                        `hsl(${hue},90%,${isHead ? 82 : 64}%)`;


                    ctx.shadowBlur =
                        isHead ? 35 : 20;

                    ctx.shadowColor =
                        color;

                    ctx.fillStyle =
                        color;


                    const size =
                        isHead ? 18 : 16;


                    const offset =
                        (20 - size) / 2;


                    ctx.beginPath();


                    if (
                        ctx.roundRect
                    ) {

                        ctx.roundRect(
                            part.x + offset,
                            part.y + offset,
                            size,
                            size,
                            6
                        );

                    } else {

                        ctx.rect(
                            part.x + offset,
                            part.y + offset,
                            size,
                            size
                        );
                    }


                    ctx.fill();


                    if (isHead) {

                        ctx.fillStyle =
                            "rgba(255,255,255,.35)";

                        ctx.beginPath();

                        ctx.arc(
                            part.x + 10,
                            part.y + 10,
                            5,
                            0,
                            Math.PI * 2
                        );

                        ctx.fill();
                    }
                }
            );


            ctx.shadowBlur = 0;


            /* ITEMS */

            drawItem(
                food,
                "#ff2bd6",
                "🔴"
            );

            drawItem(
                crystal,
                "#a855f7",
                "💎"
            );

            drawItem(
                lightning,
                "#facc15",
                "⚡"
            );

            drawItem(
                shield,
                "#34d399",
                "🛡️"
            );

            drawItem(
                bomb,
                "#f87171",
                "💣"
            );

            drawItem(
                portal,
                "#818cf8",
                "🌀"
            );
        }


        /* =====================================================
           HUD
        ===================================================== */

        function updateHUD() {

            scoreEl.textContent =
                score;

            levelEl.textContent =
                level;

            bestEl.textContent =
                best;


            const powers = [];


            if (shieldActive)
                powers.push("🛡️ Shield");


            if (speedBoost)
                powers.push("⚡ Speed");


            if (paused)
                powers.push("⏸ Paused");


            powerBar.innerHTML =
                powers
                    .map(
                        p =>
                            `<div class="power">${p}</div>`
                    )
                    .join("");
        }


        /* =====================================================
           TIMER
        ===================================================== */

        function resetTimer() {

            if (timer) {

                clearInterval(timer);

                timer = null;
            }


            if (!gameRunning)
                return;


            let speed =
                Math.max(
                    45,
                    125 - level * 8
                );


            if (speedBoost)
                speed = 35;


            timer =
                setInterval(
                    gameLoop,
                    speed
                );
        }


        /* =====================================================
           GAME LOOP
        ===================================================== */

        function gameLoop() {

            if (
                !gameRunning ||
                paused
            )
                return;


            direction =
                nextDirection;


            const head = {

                x: snake[0].x,

                y: snake[0].y
            };


            if (direction === "UP")
                head.y -= CELL;

            if (direction === "DOWN")
                head.y += CELL;

            if (direction === "LEFT")
                head.x -= CELL;

            if (direction === "RIGHT")
                head.x += CELL;


            addParticles(
                snake[0].x,
                snake[0].y
            );


            snake.unshift(head);


            let ate = false;


            /* FOOD */

            if (
                food &&
                head.x === food.x &&
                head.y === food.y
            ) {

                score += 10;

                ate = true;

                spawnFood();

                spawnPowerUp();
            }


            if (!ate) {

                snake.pop();
            }


            /* CRYSTAL */

            if (
                crystal &&
                head.x === crystal.x &&
                head.y === crystal.y
            ) {

                score += 50;

                crystal = null;
            }


            /* SPEED */

            if (
                lightning &&
                head.x === lightning.x &&
                head.y === lightning.y
            ) {

                score += 20;

                lightning = null;

                speedBoost = true;

                resetTimer();


                setTimeout(
                    () => {

                        speedBoost = false;

                        resetTimer();

                    },
                    5000
                );
            }


            /* SHIELD */

            if (
                shield &&
                head.x === shield.x &&
                head.y === shield.y
            ) {

                score += 20;

                shield = null;

                shieldActive = true;


                setTimeout(
                    () => {

                        shieldActive =
                            false;

                        updateHUD();

                    },
                    6000
                );
            }


            /* BOMB */

            if (
                bomb &&
                head.x === bomb.x &&
                head.y === bomb.y
            ) {

                gameOver();

                return;
            }


            /* PORTAL */

            if (
                portal &&
                head.x === portal.x &&
                head.y === portal.y
            ) {

                portal = null;

                const newPos =
                    randomSafePosition();

                head.x =
                    newPos.x;

                head.y =
                    newPos.y;
            }


            /* LEVEL */

            const newLevel =
                Math.floor(
                    score / 100
                ) + 1;


            if (
                newLevel !== level
            ) {

                level =
                    newLevel;

                resetTimer();
            }


            /* WALL / SELF */

            const collision =

                head.x < 0 ||

                head.x >= 500 ||

                head.y < 0 ||

                head.y >= 500 ||

                hitSelf(head);


            if (collision) {

                if (shieldActive) {

                    shieldActive =
                        false;

                    snake.shift();

                } else {

                    gameOver();

                    return;
                }
            }


            drawScene();

            updateHUD();
        }


        /* =====================================================
           START GAME
        ===================================================== */

        function startGame() {

            startScreen
                .classList
                .add("hidden");

            gameOverScreen
                .classList
                .add("hidden");


            snake = [

                {
                    x: 200,
                    y: 200
                },

                {
                    x: 180,
                    y: 200
                },

                {
                    x: 160,
                    y: 200
                }
            ];


            direction =
                "RIGHT";

            nextDirection =
                "RIGHT";

            score = 0;

            level = 1;

            paused = false;

            shieldActive = false;

            speedBoost = false;

            particles = [];


            clearPowerUps();

            spawnFood();

            spawnPowerUp();


            gameRunning = true;


            updateHUD();

            resetTimer();

            drawScene();
        }


        /* =====================================================
           PAUSE
        ===================================================== */

        function pauseGame() {

            if (!gameRunning)
                return;


            paused =
                !paused;


            if (paused) {

                clearInterval(timer);

                timer = null;

            } else {

                resetTimer();
            }


            updateHUD();
        }


        /* =====================================================
           GAME OVER
        ===================================================== */

        function gameOver() {

            gameRunning =
                false;


            clearInterval(timer);

            timer = null;


            if (score > best) {

                best =
                    score;

                localStorage.setItem(
                    "snakeBest",
                    String(best)
                );
            }


            finalScoreEl.textContent =
                score;


            bestEl.textContent =
                best;


            gameOverScreen
                .classList
                .remove("hidden");


            updateHUD();
        }


        /* =====================================================
           DIRECTION
        ===================================================== */

        function setDirection(newDirection) {

            if (
                !gameRunning ||
                paused
            )
                return;


            const opposite = {

                UP: "DOWN",

                DOWN: "UP",

                LEFT: "RIGHT",

                RIGHT: "LEFT"
            };


            if (
                newDirection !==
                opposite[direction]
            ) {

                nextDirection =
                    newDirection;
            }
        }


        /* =====================================================
           KEYBOARD
        ===================================================== */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "ArrowUp"
                ) {

                    event.preventDefault();

                    setDirection("UP");

                } else if (
                    event.key ===
                    "ArrowDown"
                ) {

                    event.preventDefault();

                    setDirection("DOWN");

                } else if (
                    event.key ===
                    "ArrowLeft"
                ) {

                    event.preventDefault();

                    setDirection("LEFT");

                } else if (
                    event.key ===
                    "ArrowRight"
                ) {

                    event.preventDefault();

                    setDirection("RIGHT");

                } else if (
                    event.key === " "
                ) {

                    event.preventDefault();

                    pauseGame();
                }
            }
        );


        /* =====================================================
           MOBILE BUTTONS
        ===================================================== */

        document
            .querySelectorAll(
                "[data-dir]"
            )
            .forEach(button => {

                const handler =
                    event => {

                        if (
                            event.cancelable
                        ) {

                            event.preventDefault();
                        }


                        const dir =
                            button
                                .dataset
                                .dir;


                        if (dir === "up")
                            setDirection("UP");

                        if (dir === "down")
                            setDirection("DOWN");

                        if (dir === "left")
                            setDirection("LEFT");

                        if (dir === "right")
                            setDirection("RIGHT");
                    };


                button.addEventListener(
                    "pointerdown",
                    handler,
                    {
                        passive: false
                    }
                );
            });


        /* =====================================================
           BUTTON EVENTS
        ===================================================== */

        playBtn.addEventListener(
            "click",
            startGame
        );

        startBtn.addEventListener(
            "click",
            startGame
        );

        restartBtn.addEventListener(
            "click",
            startGame
        );

        pauseBtn.addEventListener(
            "click",
            pauseGame
        );


        /* =====================================================
           BORDER ANIMATION
        ===================================================== */

        function animateBorder() {

            document.documentElement
                .style
                .setProperty(
                    "--border-angle",
                    (
                        performance.now() / 20
                    ) + "deg"
                );


            requestAnimationFrame(
                animateBorder
            );
        }


        animateBorder();


        /* =====================================================
           INITIAL CANVAS
        ===================================================== */

        drawScene();


        /* =====================================================
           SERVICE WORKER
        ===================================================== */

        if (
            "serviceWorker" in navigator
        ) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker
                        .register("./sw.js")
                        .catch(
                            error =>
                                console.log(
                                    "Service Worker:",
                                    error
                                )
                        );
                }
            );
        }

    </script>

</body>
